[project]
name = "ckanext-fair3r-doi"
version = "3.3.5"
description = "A CKAN extension for assigning a digital object identifier (DOI) to datasets, using the DataCite DOI service."
readme = "README.md"
requires-python = ">=3.6"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Natural History Museum", email = "data@nhm.ac.uk" }
]
keywords = ["CKAN", "data", "doi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8"
]
dependencies = [
    "jsonschema==3.0.0",
    "xmltodict==0.12.0",
    "datacite==1.4.0",
    "ckantools==0.5.0"
]

[project.optional-dependencies]
test = [
    "mock",
    "pytest==7.4.4",
    "pytest-cov==4.1.0",
    "coveralls"
]

[project.urls]
repository = "https://github.com/NaturalHistoryMuseum/ckanext-doi"
changelog = "https://github.com/NaturalHistoryMuseum/ckanext-doi/blob/main/CHANGELOG.md"

[project.entry-points."ckan.plugins"]
doi = "ckanext.doi.plugin:DOIPlugin"

[project.entry-points."babel.extractors"]
ckan = "ckan.lib.extract:extract_ckan"


[build-system]
# Pinned below 77: setuptools>=77 emits Metadata-Version 2.4 (PEP 639),
# which this GitLab instance's PyPI package registry rejects with a
# 400 Bad Request on upload.
requires = ["setuptools<77", "wheel"]
build-backend = "setuptools.build_meta"


[tool]
[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
exclude = ["docs"]

[tool.setuptools.package-data]
"ckanext.doi.theme" = ["*", "**/*"]
"ckanext.doi.public" = ["*", "**/*"]
"ckanext.doi.i18n" = ["*.pot", "**/*.po", "**/*.mo"]
"ckanext.doi.tests" = ["test.ini"]

[tool.commitizen]
name = "cz_nhm"
version = "3.1.17"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_incremental = true
version_files = [
    "pyproject.toml:version",
    "CITATION.cff:^version"
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
ignore = ["EXE001"]

[tool.pylint]
max-line-length = 88
disable = ["C0114", "R0903"]

[tool.docformatter]
wrap-summaries = 88
wrap-descriptions = 88
pre-summary-newline = true
make-summary-multi-line = true
