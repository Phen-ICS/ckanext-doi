# Pipeline stages
stages:
  - validate
  - build
  - publish
  - cleanup

# Global variables
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

# Workflow
workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - when: never

# Pip cache
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

# Default Python image and bootstrap
default:
  image: python:3.10-alpine
  tags:
    - ics-docker
  before_script:
    - python -m pip install --upgrade pip setuptools wheel

# Linting (ruff)
lint:ruff:
  stage: validate
  script:
    - pip install ruff
    - ruff check ckanext

# Format check (ruff format)
lint:ruff-format:
  stage: validate
  script:
    - pip install ruff
    - ruff format --check ckanext

# Security scan (bandit)
security:bandit:
  stage: validate
  script:
    - pip install bandit
    - bandit -r ckanext -x ckanext/doi/tests

# Python dependency audit
security:pip-audit:
  stage: validate
  allow_failure: true
  script:
    - pip install pip-audit
    - pip-audit

# Build Python package
build:package:
  stage: build
  script:
    - pip install build twine
    - python -m build
    - twine check dist/*
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/

# Publish python package to our gitlab PyPI (automatic)
publish:pypi:
  stage: publish
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.10-slim
  needs:
    - build:package
  variables:
    TWINE_USERNAME: "gitlab-ci-token"
    TWINE_PASSWORD: "$CI_JOB_TOKEN"
    TWINE_REPOSITORY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
  before_script:
    - python -m pip install --upgrade pip setuptools wheel twine
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never
  script:
    - test -d dist && ls -l dist
    - twine upload --non-interactive dist/*

# Publish python package preview to our gitlab PyPI (automatic)
# Publishes the current version from setup.py as-is; deleted from registry after validation.
publish:pypi:preview:
  stage: publish
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.10-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    TWINE_USERNAME: "gitlab-ci-token"
    TWINE_PASSWORD: "$CI_JOB_TOKEN"
    TWINE_REPOSITORY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
  before_script:
    - python3 -m pip install --upgrade pip setuptools wheel build twine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
    - when: never
  script:
    - rm -rf dist/
    - python3 -m build
    - twine check dist/*
    - |
      python3 - <<'EOF'
      import json, os, pathlib, re, urllib.request, urllib.error

      version = re.search(r'(?m)^version\s*=\s*"([^"]+)"', pathlib.Path("pyproject.toml").read_text()).group(1)
      api     = os.environ["CI_API_V4_URL"]
      project = os.environ["CI_PROJECT_ID"]
      token   = os.environ["CI_JOB_TOKEN"]
      headers = {"JOB-TOKEN": token}

      url = f"{api}/projects/{project}/packages?package_name=ckanext-fair3r-doi&package_version={version}&package_type=pypi"
      req = urllib.request.Request(url, headers=headers)
      with urllib.request.urlopen(req) as r:
          pkgs = json.load(r)

      if pkgs:
          pkg_id = pkgs[0]["id"]
          print(f"Deleting existing preview package {version} (id={pkg_id}) before re-upload...")
          del_req = urllib.request.Request(f"{api}/projects/{project}/packages/{pkg_id}", headers=headers, method="DELETE")
          try:
              urllib.request.urlopen(del_req)
          except urllib.error.HTTPError as e:
              raise SystemExit(f"DELETE failed: {e.code} {e.reason}")
          print("Deleted.")
      else:
          print(f"No existing preview package {version} found, proceeding with upload.")
      EOF
    - twine upload --non-interactive dist/*

# Trigger deploy pipeline in fair3r-docker-alt starting from integration (automatic)
# Launches the full pipeline: ansible_lint -> deploy_integration -> deploy_validation.
trigger:fair3r-docker-alt:integration:
  stage: publish
  needs:
    - job: publish:pypi:preview
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
    - when: never
  trigger:
    project: ics/fair3r-docker-alt
    branch: main
    strategy: depend

# Delete preview package from registry after validation (automatic)
# Must be triggered automatically AFTER deploy_validation has run, to ensure
# the preview package is still available when Ansible installs it.
cleanup:pypi:preview:
  stage: cleanup
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.10-slim
  needs:
    - job: trigger:fair3r-docker-alt:integration
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - when: never
  script:
    - |
      python3 - <<'EOF'
      import json, os, pathlib, re, urllib.request, urllib.error

      version = re.search(r'(?m)^version\s*=\s*"([^"]+)"', pathlib.Path("pyproject.toml").read_text()).group(1)
      api     = os.environ["CI_API_V4_URL"]
      project = os.environ["CI_PROJECT_ID"]
      token   = os.environ["CI_JOB_TOKEN"]
      headers = {"JOB-TOKEN": token}

      print(f"Deleting preview package {version} from registry...")

      url = f"{api}/projects/{project}/packages?package_name=ckanext-fair3r-doi&package_version={version}&package_type=pypi"
      req = urllib.request.Request(url, headers=headers)
      with urllib.request.urlopen(req) as r:
          pkgs = json.load(r)

      if not pkgs:
          raise SystemExit(f"Package not found in registry: {version}")

      pkg_id = pkgs[0]["id"]
      print(f"Found package ID: {pkg_id}")

      del_req = urllib.request.Request(f"{api}/projects/{project}/packages/{pkg_id}", headers=headers, method="DELETE")
      try:
          urllib.request.urlopen(del_req)
      except urllib.error.HTTPError as e:
          raise SystemExit(f"DELETE failed: {e.code} {e.reason}")

      print(f"Package {version} deleted from registry.")
      EOF
