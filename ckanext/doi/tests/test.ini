[DEFAULT]
debug = false
smtp_server = localhost
error_email_from = paste@localhost

[server:main]
use = egg:Paste#http
host = 0.0.0.0
port = 5000

[app:main]
use = config:/usr/lib/ckan/default/src/ckan/test-core.ini

sqlalchemy.url = postgresql://ckan:%(CKAN_DB_PASSWORD)s@%(CKAN_DB_HOST)s:%(CKAN_DB_PORT)s/ckan_test
ckan.datastore.write_url = postgresql://ckan_datastore:%(CKAN_DATASTORE_DB_PASSWORD)s@%(CKAN_DB_HOST)s:%(CKAN_DB_PORT)s/datastore_test
ckan.datastore.read_url = postgresql://ckan_datastore_ro:%(CKAN_DATASTORE_READONLY_PASSWORD)s@%(CKAN_DB_HOST)s:%(CKAN_DB_PORT)s/datastore_test
ckan.redis.url = redis://redis:6379/1
solr_url = http://solr:8983/solr/ckan

ckanext.doi.prefix = testing
ckanext.doi.account_name = test-account
ckanext.doi.account_password = test-password
ckanext.doi.publisher = Test Publisher
ckanext.doi.site_url = http://not-a-real-url.com
ckanext.doi.site_title = Test Site Title
ckanext.doi.test_mode = True

[loggers]
keys = root, ckan, ckanext

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_ckan]
level = INFO
handlers = console
qualname = ckan
propagate = 0

[logger_ckanext]
level = DEBUG
handlers = console
qualname = ckanext
propagate = 0

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
